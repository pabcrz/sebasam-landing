name: Reporte de error
description: Reporta un problema reproducible del sitio público de SEBASAM.
title: "fix: "
labels:
  - bug
  - status:needs-review
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar un problema. Una persona responsable del mantenimiento debe agregar `status:approved` antes de iniciar la implementación.

  - type: checkboxes
    id: preflight
    attributes:
      label: Comprobaciones previas
      options:
        - label: Busqué en los issues existentes y no encontré un duplicado.
          required: true
        - label: Eliminé secretos, datos privados de clientes y otra información sensible.
          required: true
        - label: Entiendo que este issue debe aprobarse antes de abrir un pull request.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Descripción del error
      description: Explica el problema y su impacto en visitantes o responsables del mantenimiento.
      placeholder: La acción de contacto no abre el destino esperado...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Pasos para reproducir el problema
      description: Proporciona una secuencia mínima y numerada que muestre el problema de forma consistente.
      placeholder: |
        1. Abre ...
        2. Selecciona ...
        3. Observa ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportamiento actual
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Página o URL afectada
      placeholder: https://sebasam.online/info
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Navegador y dispositivo
      description: Incluye la versión del navegador, el sistema operativo y el dispositivo o tamaño de ventana cuando sea pertinente.
      placeholder: Safari 18 en iPhone 15, iOS 18
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Capturas de pantalla o registros
      description: Agrega evidencia sin información sensible que ayude a reproducir o diagnosticar el problema.

  - type: textarea
    id: context
    attributes:
      label: Contexto adicional
      description: Incluye frecuencia, soluciones temporales, regresiones o impacto en la accesibilidad.
