name: Solicitud de funcionalidad
description: Propón una mejora al sitio público de SEBASAM o a su flujo de mantenimiento.
title: "feat: "
labels:
  - enhancement
  - status:needs-review
body:
  - type: markdown
    attributes:
      value: |
        Describe el problema de visitantes o responsables del mantenimiento antes de proponer una implementación. Una persona responsable del mantenimiento debe agregar `status:approved` antes de iniciar el trabajo.

  - type: checkboxes
    id: preflight
    attributes:
      label: Comprobaciones previas
      options:
        - label: Busqué en los issues existentes y no encontré un duplicado.
          required: true
        - label: Esta solicitud no incluye secretos, datos privados de clientes ni afirmaciones comerciales sin verificar.
          required: true
        - label: Entiendo que este issue debe aprobarse antes de abrir un pull request.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: ¿Qué necesidad de visitantes o responsables del mantenimiento no se está atendiendo?
      placeholder: Los visitantes no pueden fácilmente...
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Resultado deseado
      description: Describe el resultado observable, no solo una tecnología preferida.
      placeholder: Los visitantes deberían poder...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Solución propuesta
      description: Explica cómo podría funcionar la experiencia sin alterar la arquitectura de Astro con prioridad estática.

  - type: dropdown
    id: area
    attributes:
      label: Área afectada
      options:
        - Contenido e información del negocio
        - Páginas y componentes de Astro
        - CSS nativo y diseño visual
        - Accesibilidad
        - SEO y datos estructurados
        - Rendimiento y recursos
        - Compilación, despliegue o herramientas
        - Documentación y flujo de colaboración
        - Otra
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
      description: Describe las soluciones temporales actuales o los enfoques más sencillos que consideraste.

  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación sugeridos
      description: Enumera los resultados objetivos necesarios para completar y verificar esta solicitud.
      placeholder: |
        - [ ] ...
        - [ ] ...

  - type: textarea
    id: context
    attributes:
      label: Contexto adicional
      description: Agrega referencias, propuestas visuales, ejemplos o restricciones sin información sensible.
