name: Mejora de documentación
description: Propón una mejora con alcance definido para la documentación del repositorio.
title: "docs: "
labels:
  - documentation
  - status:needs-review
body:
  - type: markdown
    attributes:
      value: |
        Usa este formulario para cambios de documentación. Enfoca la propuesta en un solo resultado.

  - type: input
    id: summary
    attributes:
      label: Resumen
      description: ¿Qué documentación debe cambiar y por qué?
      placeholder: Simplificar el README como punto de entrada conciso al repositorio.
    validations:
      required: true

  - type: textarea
    id: current-state
    attributes:
      label: Estado actual
      description: Describe la documentación confusa, desactualizada, duplicada o faltante.
      placeholder: El README mezcla la introducción al proyecto, los requisitos del producto, la arquitectura y la hoja de ruta.
    validations:
      required: true

  - type: textarea
    id: desired-outcome
    attributes:
      label: Resultado deseado
      description: Describe qué debe cumplirse después del cambio de documentación.
      placeholder: El README explica qué es el proyecto, cómo ejecutarlo y dónde se encuentra la documentación detallada.
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Alcance
      description: Confirma los límites previstos para este cambio de documentación.
      options:
        - label: Este cambio es únicamente de documentación.
          required: true
        - label: El cambio no agregará secretos, datos privados ni rutas personales de equipos.
          required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Criterios de aceptación
      description: Enumera las condiciones concretas necesarias para completar este issue.
      placeholder: |
        - El README contiene comandos de instalación y verificación.
        - Las indicaciones detalladas de producto y arquitectura tienen una ubicación documentada.
        - Los enlaces del README se resuelven correctamente.
    validations:
      required: true
